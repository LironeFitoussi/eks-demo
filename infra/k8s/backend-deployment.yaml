apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: helpdesk-prod
  labels:
    app: backend
    app.kubernetes.io/name: helpdesk-api
    environment: prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/name: helpdesk-api
    spec:
      containers:
        - name: backend
          # Replace ECR_URL with the actual ECR registry URL output from Terraform
          image: ECR_URL/helpdesk-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /auth/profile
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /auth/profile
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3
      terminationGracePeriodSeconds: 30
