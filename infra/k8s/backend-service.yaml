apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: helpdesk-prod
  labels:
    app: backend
    app.kubernetes.io/name: helpdesk-api
    environment: prod
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
