apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: helpdesk-prod
  labels:
    app: frontend
    app.kubernetes.io/name: helpdesk-frontend
    environment: prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/name: helpdesk-frontend
    spec:
      containers:
        - name: frontend
          # Replace ECR_URL with the actual ECR registry URL output from Terraform
          image: ECR_URL/helpdesk-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
      terminationGracePeriodSeconds: 30
