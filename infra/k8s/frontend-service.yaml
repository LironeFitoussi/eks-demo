apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: helpdesk-prod
  labels:
    app: frontend
    app.kubernetes.io/name: helpdesk-frontend
    environment: prod
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
