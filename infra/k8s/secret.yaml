apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: helpdesk-prod
  labels:
    app.kubernetes.io/name: helpdesk-api
    environment: prod
type: Opaque
data:
  # To encode values, run: echo -n "your-secret-value" | base64
  #
  # MONGODB_URI example:
  #   echo -n "mongodb+srv://user:password@cluster.mongodb.net/helpdesk?retryWrites=true&w=majority" | base64
  MONGODB_URI: bW9uZ29kYjovL3VzZXI6cGFzc3dvcmRAY2x1c3Rlci5leGFtcGxlLmNvbS9oZWxwZGVzaw==

  # JWT_SECRET example:
  #   echo -n "your-long-random-jwt-secret-string" | base64
  JWT_SECRET: Y2hhbmdlLW1lLXRvLWEtc3Ryb25nLXJhbmRvbS1zZWNyZXQ=
